                      val x = w * (0.5f + 0.42f * sin(t * params[o] + params[o+2]))
                      val y = h * (0.5f + 0.42f * cos(t * params[o+1] + params[o+3]))
                      m.setTranslate(x, y); blobs[i].setLocalMatrix(m); p.shader = blobs[i]
                      p.alpha = (200 + 55 * sin(t * 0.25f + i * 1.3f)).toInt()
                      c.drawCircle(x, y, params[o+4], p)
