          package com.example.tvclock

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Paint
          import android.graphics.RadialGradient
          import android.graphics.Shader
          import android.os.SystemClock
          import android.util.AttributeSet
          import android.view.View
          import kotlin.math.max

          class ScreensaverView @JvmOverloads constructor(context: Context, attrs: AttributeSet? = null) :
              View(context, attrs) {

              private val scenes = List(Scenes.titles.size) { Scenes.create(it) }
              var weather: WeatherData? = null

              private var autoRotate = true
              private var rotateSec = 60
              private var index = 4
              private var running = false
              private var startMs = 0L
              private var lastMs = 0L
              private var switchT = 0f
              private var fadeT = -10f
              private val overlay = Paint()
              private var scrim: RadialGradient? = null
              private val tick = Runnable { invalidate() }

              fun configure(mode: Int, interval: Int) {
                  autoRotate = mode < 0
                  rotateSec = interval.coerceAtLeast(10)
                  if (mode >= 0) { index = mode.coerceIn(0, scenes.size - 1); switchT = nowT(); fadeT = switchT }
              }
              fun start() { if (!running) { running = true; invalidate() } }
              fun stop() { running = false; removeCallbacks(tick) }
              fun next() = setScene((index + 1) % scenes.size)
              fun prev() = setScene((index + scenes.size - 1) % scenes.size)

              private fun setScene(i: Int) { index = i; switchT = nowT(); fadeT = switchT }
              private fun nowT() = if (startMs == 0L) 0f else (SystemClock.uptimeMillis() - startMs) / 1000f

              override fun onSizeChanged(w: Int, h: Int, ow: Int, oh: Int) {
                  scenes.forEach { it.resize(w, h) }
                  scrim = RadialGradient(w / 2f, h / 2f, max(w, h) * 0.75f,
                      intArrayOf(0x5A000000, 0x00000000), floatArrayOf(0f, 0.7f), Shader.TileMode.CLAMP)
              }

              override fun onDraw(canvas: Canvas) {
                  val now = SystemClock.uptimeMillis()
                  if (startMs == 0L) { startMs = now; lastMs = now; fadeT = 0f; switchT = 0f }
                  val t = (now - startMs) / 1000f
                  val dt = ((now - lastMs) / 1000f).coerceIn(0.001f, 0.1f)
                  lastMs = now
                  scenes[index].draw(canvas, t, dt, weather)
                  scrim?.let { overlay.shader = it; canvas.drawRect(0f, 0f, width.toFloat(), height.toFloat(), overlay) }
                  val fade = 1f - ((t - fadeT) / 0.8f).coerceIn(0f, 1f)
                  if (fade > 0f) canvas.drawARGB((fade * 255).toInt(), 0, 0, 0)
                  if (autoRotate && t - switchT >= rotateSec) setScene((index + 1) % scenes.size)
                  if (running) postDelayed(tick, 33L)
              }

              override fun onDetachedFromWindow() { stop(); super.onDetachedFromWindow() }
          }
