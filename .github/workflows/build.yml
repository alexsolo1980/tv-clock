          package com.example.tvclock

          import android.animation.ValueAnimator
          import android.view.View
          import android.view.animation.LinearInterpolator
          import android.widget.TextView
          import kotlinx.coroutines.*
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import kotlin.math.PI
          import kotlin.math.cos
          import kotlin.math.roundToInt
          import kotlin.math.sin

          class ClockController(root: View, private val scope: CoroutineScope, private val prefs: Prefs) {

              private val scenes = root.findViewById<ScreensaverView>(R.id.scenes)
              private val content = root.findViewById<View>(R.id.content)
              private val timeText = root.findViewById<TextView>(R.id.time)
              private val dateText = root.findViewById<TextView>(R.id.date)
              private val iconText = root.findViewById<TextView>(R.id.weatherIcon)
              private val tempText = root.findViewById<TextView>(R.id.temp)
              private val descText = root.findViewById<TextView>(R.id.desc)
              private val feelsText = root.findViewById<TextView>(R.id.feels)
              private val detailsText = root.findViewById<TextView>(R.id.details)
              private val cityText = root.findViewById<TextView>(R.id.city)
              private val hint = root.findViewById<TextView>(R.id.hint)

              private var job: Job? = null
              private var drift: ValueAnimator? = null
              private val ru = Locale("ru")

              fun start() {
                  stop()
                  scenes.configure(prefs.sceneMode, prefs.rotateSec)
                  scenes.start()
                  pokeHint()
                  tickClock()
                  job = scope.launch {
                      launch { while (true) { delay(1000); tickClock() } }
                      launch { weatherLoop() }
                  }
                  drift = ValueAnimator.ofFloat(0f, (2 * PI).toFloat()).apply {
                      duration = 240_000; repeatCount = ValueAnimator.INFINITE
                      interpolator = LinearInterpolator()
                      addUpdateListener {
                          val v = it.animatedValue as Float
                          content.translationX = sin(v) * 30f
                          content.translationY = cos(v * 0.7f) * 20f
                      }
                      start()
                  }
              }

              fun stop() { job?.cancel(); job = null; drift?.cancel(); drift = null; scenes.stop() }
              fun nextScene() { scenes.next(); pokeHint() }
              fun prevScene() { scenes.prev(); pokeHint() }
              fun hideHint() { hint.visibility = View.GONE }
              fun pokeHint() {
                  hint.animate().cancel(); hint.alpha = 0.8f
                  hint.animate().alpha(0f).setStartDelay(5000).setDuration(700).start()
              }

              private fun tickClock() {
                  val now = Date()
                  timeText.text = SimpleDateFormat(if (prefs.use24h) "HH:mm" else "h:mm a", ru).format(now)
                  dateText.text = SimpleDateFormat("EEEE, d MMMM", ru).format(now)
                      .replaceFirstChar { it.uppercase() }
              }

              private suspend fun weatherLoop() {
                  prefs.cachedWeather?.let { raw ->
                      try { show(WeatherRepository.parse(raw), prefs.cachedAt) } catch (_: Exception) {}
                  }
                  while (true) {
                      try {
                          val w = WeatherRepository.current(prefs.lat, prefs.lon)
                          prefs.cachedWeather = w.raw; prefs.cachedAt = w.fetchedAt
                          show(w, w.fetchedAt)
                          delay(15 * 60_000L)
                      } catch (e: CancellationException) { throw e
                      } catch (e: Exception) { delay(60_000L) }
                  }
              }

              private fun show(w: WeatherData, at: Long) {
                  scenes.weather = w
                  iconText.text = w.icon
                  tempText.text = fmt(w.temp)
                  descText.text = w.description
                  feelsText.text = "ощущается как ${fmt(w.feels)}"
                  var d = "влажность ${w.humidity}%   •   ветер ${w.wind.roundToInt()} м/с"
                  if (w.tMin != null && w.tMax != null) d += "   •   ${fmt(w.tMin)} … ${fmt(w.tMax)}"
                  detailsText.text = d
                  cityText.text = "${prefs.cityName}   •   обновлено ${SimpleDateFormat("HH:mm", ru).format(Date(at))}"
              }

              private fun fmt(v: Double): String {
                  val r = v.roundToInt()
                  return (if (r > 0) "+" else "") + r + "°"
              }
          }
          EOF

          cat > app/src/main/java/com/example/tvclock/MainActivity.kt <<'EOF'
          package com.example.tvclock

          import android.app.Activity
          import android.content.Intent
          import android.os.Bundle
          import android.view.KeyEvent
          import android.view.View
          import android.view.WindowManager
          import kotlinx.coroutines.MainScope
          import kotlinx.coroutines.cancel

          class MainActivity : Activity() {
              private val scope = MainScope()
              private lateinit var controller: ClockController

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  setContentView(R.layout.activity_main)
                  controller = ClockController(findViewById(R.id.root), scope, Prefs(this))
              }

              override fun onResume() { super.onResume(); immersive(); controller.start() }
              override fun onPause() { controller.stop(); super.onPause() }
              override fun onDestroy() { scope.cancel(); super.onDestroy() }

              @Suppress("DEPRECATION")
              private fun immersive() {
                  window.decorView.systemUiVisibility =
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY or View.SYSTEM_UI_FLAG_FULLSCREEN or
                      View.SYSTEM_UI_FLAG_HIDE_NAVIGATION or View.SYSTEM_UI_FLAG_LAYOUT_STABLE or
                      View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN or View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
              }

              override fun onKeyDown(keyCode: Int, event: KeyEvent?): Boolean = when (keyCode) {
                  KeyEvent.KEYCODE_DPAD_CENTER, KeyEvent.KEYCODE_ENTER, KeyEvent.KEYCODE_NUMPAD_ENTER,
                  KeyEvent.KEYCODE_DPAD_RIGHT -> { controller.nextScene(); true }
                  KeyEvent.KEYCODE_DPAD_LEFT -> { controller.prevScene(); true }
                  KeyEvent.KEYCODE_MENU, KeyEvent.KEYCODE_DPAD_UP, KeyEvent.KEYCODE_SETTINGS -> {
                      startActivity(Intent(this, SettingsActivity::class.java)); true
                  }
                  else -> super.onKeyDown(keyCode, event)
              }
          }
          EOF

          cat > app/src/main/java/com/example/tvclock/SettingsActivity.kt <<'EOF'
          package com.example.tvclock

          import android.app.Activity
          import android.os.Bundle
          import android.view.View
          import android.widget.*
          import kotlinx.coroutines.MainScope
          import kotlinx.coroutines.cancel
          import kotlinx.coroutines.launch

          class SettingsActivity : Activity() {
              private val scope = MainScope()
              private lateinit var prefs: Prefs
              private var places: List<WeatherRepository.Place> = emptyList()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_settings)
                  prefs = Prefs(this)

                  val query = findViewById<EditText>(R.id.cityQuery)
                  val results = findViewById<ListView>(R.id.results)
                  val current = findViewById<TextView>(R.id.currentCity)
                  fun updateCurrent() { current.text = "Текущий город: ${prefs.cityName}" }
                  updateCurrent()

                  val search = {
                      val q = query.text.toString().trim()
                      if (q.isNotEmpty()) scope.launch {
                          try {
                              places = WeatherRepository.search(q)
                              if (places.isEmpty()) { toast("Ничего не найдено"); results.visibility = View.GONE }
                              else {
                                  results.adapter = ArrayAdapter(this@SettingsActivity,
                                      android.R.layout.simple_list_item_1, places.map { it.display })
                                  results.visibility = View.VISIBLE
                              }
                          } catch (e: Exception) { toast("Ошибка сети: ${e.message}") }
                      }
                  }
                  findViewById<Button>(R.id.btnSearch).setOnClickListener { search() }
                  query.setOnEditorActionListener { _, _, _ -> search(); true }
                  results.setOnItemClickListener { _, _, pos, _ ->
                      val pl = places[pos]
                      prefs.cityName = pl.name; prefs.lat = pl.lat; prefs.lon = pl.lon
                      prefs.cachedWeather = null
                      updateCurrent(); results.visibility = View.GONE; query.setText("")
                      toast("Город сохранён: ${pl.display}")
                  }

                  val sceneSpinner = findViewById<Spinner>(R.id.sceneSpinner)
                  sceneSpinner.adapter = ArrayAdapter(this, android.R.layout.simple_spinner_item,
                      listOf("Авто-смена заставок") + Scenes.titles).also {
                      it.setDropDownViewResource(android.R.layout.simple_spinner_dropdown_item)
                  }
                  sceneSpinner.setSelection(prefs.sceneMode + 1)
                  sceneSpinner.onItemSelectedListener = object : AdapterView.OnItemSelectedListener {
                      override fun onItemSelected(p: AdapterView<*>?, v: View?, pos: Int, id: Long) { prefs.sceneMode = pos - 1 }
                      override fun onNothingSelected(p: AdapterView<*>?) {}
                  }

                  val intervals = listOf(30, 60, 300)
                  val intervalSpinner = findViewById<Spinner>(R.id.intervalSpinner)
                  intervalSpinner.adapter = ArrayAdapter(this, android.R.layout.simple_spinner_item,
                      listOf("Смена каждые 30 секунд", "Смена каждую минуту", "Смена каждые 5 минут")).also {
                      it.setDropDownViewResource(android.R.layout.simple_spinner_dropdown_item)
                  }
                  intervalSpinner.setSelection(intervals.indexOf(prefs.rotateSec).coerceAtLeast(0))
                  intervalSpinner.onItemSelectedListener = object : AdapterView.OnItemSelectedListener {
                      override fun onItemSelected(p: AdapterView<*>?, v: View?, pos: Int, id: Long) { prefs.rotateSec = intervals[pos] }
                      override fun onNothingSelected(p: AdapterView<*>?) {}
                  }

                  val format = findViewById<CheckBox>(R.id.format24)
                  format.isChecked = prefs.use24h
                  format.setOnCheckedChangeListener { _, checked -> prefs.use24h = checked }

                  findViewById<Button>(R.id.done).setOnClickListener { finish() }
                  sceneSpinner.requestFocus()
              }

              private fun toast(s: String) = Toast.makeText(this, s, Toast.LENGTH_LONG).show()
              override fun onDestroy() { scope.cancel(); super.onDestroy() }
          }
          EOF

          cat > app/src/main/java/com/example/tvclock/ClockDreamService.kt <<'EOF'
          package com.example.tvclock

          import android.service.dreams.DreamService
          import android.view.LayoutInflater
          import kotlinx.coroutines.MainScope
          import kotlinx.coroutines.cancel

          class ClockDreamService : DreamService() {
              private val scope = MainScope()
              private var controller: ClockController? = null

              override fun onAttachedToWindow() {
                  super.onAttachedToWindow()
                  setFullscreen(true)
                  setInteractive(true)
                  val root = LayoutInflater.from(this).inflate(R.layout.activity_main, null)
                  setContentView(root)
                  controller = ClockController(root, scope, Prefs(this)).apply { hideHint() }
              }

              override fun onDreamingStarted() { super.onDreamingStarted(); controller?.start() }
              override fun onDreamingStopped() { controller?.stop(); super.onDreamingStopped() }
              override fun onDetachedFromWindow() { scope.cancel(); controller = null; super.onDetachedFromWindow() }
          }
          EOF

