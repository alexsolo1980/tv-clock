          cat > app/src/main/java/com/example/tvclock/WeatherRepository.kt <<'EOF'
          package com.example.tvclock

          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import org.json.JSONObject
          import java.io.IOException
          import java.net.HttpURLConnection
          import java.net.URL
          import java.net.URLEncoder

          enum class WeatherKind { CLEAR, CLOUDY, RAIN, SNOW, FOG, STORM }

          data class WeatherData(
              val temp: Double, val feels: Double, val humidity: Int, val wind: Double,
              val code: Int, val isDay: Boolean, val tMin: Double?, val tMax: Double?,
              val fetchedAt: Long, val raw: String
          ) {
              val kind: WeatherKind get() = when (code) {
                  0, 1 -> WeatherKind.CLEAR
                  2, 3 -> WeatherKind.CLOUDY
                  45, 48 -> WeatherKind.FOG
                  in 51..67, in 80..82 -> WeatherKind.RAIN
                  in 71..77, 85, 86 -> WeatherKind.SNOW
                  95, 96, 99 -> WeatherKind.STORM
                  else -> WeatherKind.CLOUDY
              }
              val description: String get() = when (code) {
                  0 -> "Ясно"; 1 -> "Преимущественно ясно"; 2 -> "Переменная облачность"; 3 -> "Пасмурно"
                  45, 48 -> "Туман"; 51, 53, 55 -> "Морось"; 56, 57 -> "Ледяная морось"
                  61 -> "Небольшой дождь"; 63 -> "Дождь"; 65 -> "Сильный дождь"; 66, 67 -> "Ледяной дождь"
                  71 -> "Небольшой снег"; 73 -> "Снег"; 75 -> "Сильный снег"; 77 -> "Снежная крупа"
                  80, 81, 82 -> "Ливень"; 85, 86 -> "Снегопад"; 95 -> "Гроза"; 96, 99 -> "Гроза с градом"
                  else -> "Облачно"
              }
              val icon: String get() = when (kind) {
                  WeatherKind.CLEAR -> if (isDay) "☀️" else "🌙"
                  WeatherKind.CLOUDY -> if (code == 2 && isDay) "⛅" else "☁️"
                  WeatherKind.RAIN -> "🌧️"; WeatherKind.SNOW -> "❄️"
                  WeatherKind.FOG -> "🌫️"; WeatherKind.STORM -> "⛈️"
              }
          }

          object WeatherRepository {
              data class Place(val name: String, val region: String, val country: String,
                               val lat: Double, val lon: Double) {
                  val display = listOf(name, region, country).filter { it.isNotBlank() }
                      .distinct().joinToString(", ")
              }

              suspend fun search(query: String): List<Place> = withContext(Dispatchers.IO) {
                  val q = URLEncoder.encode(query, "UTF-8")
                  val json = JSONObject(get("https://geocoding-api.open-meteo.com/v1/search?name=$q&count=6&language=ru&format=json"))
                  val arr = json.optJSONArray("results") ?: return@withContext emptyList()
                  (0 until arr.length()).map {
                      val o = arr.getJSONObject(it)
                      Place(o.optString("name"), o.optString("admin1"), o.optString("country"),
                          o.getDouble("latitude"), o.getDouble("longitude"))
                  }
              }

              suspend fun current(lat: Double, lon: Double): WeatherData = withContext(Dispatchers.IO) {
                  val url = "https://api.open-meteo.com/v1/forecast?latitude=$lat&longitude=$lon" +
                      "&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,weather_code,wind_speed_10m" +
                      "&daily=temperature_2m_max,temperature_2m_min&forecast_days=1&timezone=auto&wind_speed_unit=ms"
                  parse(get(url))
              }

              fun parse(raw: String): WeatherData {
                  val o = JSONObject(raw)
                  val cur = o.getJSONObject("current")
                  val daily = o.optJSONObject("daily")
                  fun first(key: String): Double? = daily?.optJSONArray(key)
                      ?.let { if (it.length() > 0 && !it.isNull(0)) it.getDouble(0) else null }
                  return WeatherData(
                      cur.getDouble("temperature_2m"), cur.getDouble("apparent_temperature"),
                      cur.optInt("relative_humidity_2m", 0), cur.optDouble("wind_speed_10m", 0.0),
                      cur.optInt("weather_code", 0), cur.optInt("is_day", 1) == 1,
                      first("temperature_2m_min"), first("temperature_2m_max"),
                      System.currentTimeMillis(), raw
                  )
              }

              private fun get(url: String): String {
                  val conn = URL(url).openConnection() as HttpURLConnection
                  try {
                      conn.connectTimeout = 10_000; conn.readTimeout = 10_000
                      if (conn.responseCode != 200) throw IOException("HTTP ${conn.responseCode}")
                      return conn.inputStream.bufferedReader().use { it.readText() }
                  } finally { conn.disconnect() }
              }
          }
          EOF

          cat > app/src/main/java/com/example/tvclock/Scenes.kt <<'EOF'
          package com.example.tvclock

          import android.graphics.*
          import java.util.Calendar
          import kotlin.math.*
          import kotlin.random.Random

          interface Scene {
              val title: String
              fun resize(w: Int, h: Int)
              fun draw(c: Canvas, t: Float, dt: Float, weather: WeatherData?)
          }

          object Scenes {
              val titles = listOf("Северное сияние", "Космос", "Лава", "Океан", "Погода за окном", "Боке")
              fun create(i: Int): Scene = when (i) {
                  0 -> AuroraScene(); 1 -> SpaceScene(); 2 -> LavaScene()
                  3 -> OceanScene(); 4 -> WeatherScene(); else -> BokehScene()
              }
          }

          internal fun hsv(h: Float, s: Float, v: Float, a: Int = 255): Int =
              (a shl 24) or (Color.HSVToColor(floatArrayOf(((h % 360f) + 360f) % 360f, s, v)) and 0xFFFFFF)

          internal class StarField(seed: Int, private val count: Int) {
              private val rnd = Random(seed)
              private var pts = FloatArray(0)
              private var width = 1f; private var height = 1f

              fun resize(w: Float, h: Float) {
                  width = w; height = h
                  pts = FloatArray(count * 4)
                  for (i in 0 until count) {
                      pts[i*4] = rnd.nextFloat() * w; pts[i*4+1] = rnd.nextFloat() * h
                      pts[i*4+2] = 0.6f + rnd.nextFloat() * 1.7f; pts[i*4+3] = rnd.nextFloat() * 6.283f
                  }
              }
              fun draw(c: Canvas, t: Float, p: Paint, maxYFraction: Float = 1f, drift: Float = 0f) {
                  for (i in 0 until count) {
                      val o = i * 4
                      if (pts[o+1] > height * maxYFraction) continue
                      val a = (70 + 110 * (0.5f + 0.5f * sin(t * 1.3f + pts[o+3]))).toInt().coerceIn(0, 255)
                      p.color = Color.argb(a, 255, 255, 255)
                      var x = pts[o] - drift * t * (0.5f + pts[o+2] * 0.5f) * 8f
                      x = ((x % width) + width) % width
                      c.drawCircle(x, pts[o+1], pts[o+2], p)
                  }
              }
          }

          class AuroraScene : Scene {
              override val title = Scenes.titles[0]
              private var w = 1f; private var h = 1f
              private val stars = StarField(7, 130)
              private val p = Paint(Paint.ANTI_ALIAS_FLAG)
              private val path = Path()

              override fun resize(w: Int, h: Int) {
                  this.w = w.toFloat(); this.h = h.toFloat(); stars.resize(this.w, this.h)
              }
              override fun draw(c: Canvas, t: Float, dt: Float, weather: WeatherData?) {
                  p.shader = LinearGradient(0f, 0f, 0f, h, 0xFF030014.toInt(), 0xFF0A1B3D.toInt(), Shader.TileMode.CLAMP)
                  c.drawRect(0f, 0f, w, h, p); p.shader = null
                  stars.draw(c, t, p, 0.75f)
                  for (i in 0..2) {
                      val hue = 130f + i * 40f + 25f * sin(t * 0.07f + i * 1.7f)
                      val baseY = h * (0.26f + 0.08f * i)
                      val amp = h * 0.055f
                      val band = h * (0.30f + 0.05f * i)
                      fun yAt(k: Int) = baseY +
                          sin(k * 0.55f + t * (0.25f + 0.07f * i) + i * 2.1f) * amp +
                          sin(k * 0.13f - t * 0.1f) * amp * 0.8f
                      path.reset()
                      val n = 30
                      for (k in 0..n) { val x = w * k / n; if (k == 0) path.moveTo(x, yAt(k)) else path.lineTo(x, yAt(k)) }
                      for (k in n downTo 0) path.lineTo(w * k / n, yAt(k) + band * (0.85f + 0.15f * sin(k * 0.4f + t * 0.3f)))
                      path.close()
                      p.shader = LinearGradient(0f, baseY - amp * 2, 0f, baseY + band,
                          intArrayOf(hsv(hue, 0.8f, 1f, 0), hsv(hue, 0.65f, 1f, 120), hsv(hue + 40f, 0.8f, 0.9f, 0)),
                          floatArrayOf(0f, 0.2f, 1f), Shader.TileMode.CLAMP)
                      c.drawPath(path, p)
                  }
                  p.shader = null
              }
          }

          class SpaceScene : Scene {
              override val title = Scenes.titles[1]
              private var w = 1f; private var h = 1f
              private val p = Paint(Paint.ANTI_ALIAS_FLAG)
              private val stars = StarField(42, 240)
              private val m = Matrix()
              private var nebulae = emptyArray<RadialGradient>()
              private var nebR = 1f

              override fun resize(w: Int, h: Int) {
                  this.w = w.toFloat(); this.h = h.toFloat(); stars.resize(this.w, this.h)
                  nebR = min(this.w, this.h) * 0.55f
                  nebulae = Array(3) {
                      val hue = floatArrayOf(265f, 200f, 320f)[it]
                      RadialGradient(0f, 0f, nebR,
                          intArrayOf(hsv(hue, 0.7f, 0.9f, 60), hsv(hue, 0.7f, 0.6f, 0)), null, Shader.TileMode.CLAMP)
                  }
              }
              override fun draw(c: Canvas, t: Float, dt: Float, weather: WeatherData?) {
                  p.shader = LinearGradient(0f, 0f, 0f, h, 0xFF04060F.toInt(), 0xFF101433.toInt(), Shader.TileMode.CLAMP)
                  c.drawRect(0f, 0f, w, h, p)
                  for (i in 0..2) {
                      val nx = w * (0.5f + 0.4f * sin(t * 0.03f + i * 2.4f))
                      val ny = h * (0.45f + 0.35f * cos(t * 0.025f + i * 1.9f))
                      m.setTranslate(nx, ny); nebulae[i].setLocalMatrix(m); p.shader = nebulae[i]
                      c.drawCircle(nx, ny, nebR, p)
                  }
                  p.shader = null
                  stars.draw(c, t, p, 1f, 1f)
                  val k = floor(t / 8f).toInt(); val ph = (t - k * 8f) / 1.1f
                  if (ph in 0.02f..1f) {
                      val r = Random(k * 31 + 5)
                      val sx = w * (0.15f + r.nextFloat() * 0.7f); val sy = h * (0.05f + r.nextFloat() * 0.3f)
                      val dx = -w * 0.25f; val dy = h * 0.22f
                      val hx = sx + dx * ph; val hy = sy + dy * ph
                      val tp = max(0f, ph - 0.3f); val tx = sx + dx * tp; val ty = sy + dy * tp
                      p.shader = LinearGradient(tx, ty, hx, hy,
                          hsv(0f, 0f, 1f, 0), hsv(0f, 0f, 1f, (255 * (1f - ph)).toInt()), Shader.TileMode.CLAMP)
                      p.style = Paint.Style.STROKE; p.strokeWidth = 3f
                      c.drawLine(tx, ty, hx, hy, p)
                      p.style = Paint.Style.FILL; p.shader = null
                  }
              }
          }

          class LavaScene : Scene {
