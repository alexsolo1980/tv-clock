          class OceanScene : Scene {
              override val title = Scenes.titles[3]
              private var w = 1f; private var h = 1f
              private val p = Paint(Paint.ANTI_ALIAS_FLAG)
              private val path = Path()
              private val stars = StarField(3, 90)
              private val m = Matrix()
              private var glowDay: RadialGradient? = null
              private var glowNight: RadialGradient? = null
              private var glowR = 1f

              override fun resize(w: Int, h: Int) {
                  this.w = w.toFloat(); this.h = h.toFloat(); stars.resize(this.w, this.h)
                  glowR = this.h * 0.22f
                  glowDay = RadialGradient(0f, 0f, glowR, 0x78FFD54F.toInt(), 0x00FFD54F, Shader.TileMode.CLAMP)
                  glowNight = RadialGradient(0f, 0f, glowR, 0x50E9EDF7.toInt(), 0x00E9EDF7, Shader.TileMode.CLAMP)
              }
              override fun draw(c: Canvas, t: Float, dt: Float, weather: WeatherData?) {
                  val day = weather?.isDay ?: true
                  val top = if (day) hsv(215f + 10f * sin(t * 0.05f), 0.65f, 0.45f) else 0xFF0A102E.toInt()
                  val bot = if (day) hsv(25f + 15f * sin(t * 0.04f), 0.55f, 0.85f) else 0xFF1C2A55.toInt()
                  p.shader = LinearGradient(0f, 0f, 0f, h * 0.75f, top, bot, Shader.TileMode.CLAMP)
                  c.drawRect(0f, 0f, w, h, p); p.shader = null
                  if (!day) stars.draw(c, t, p, 0.55f)
                  val cx = w * 0.74f; val cy = h * 0.28f; val r = h * 0.06f
                  val glow = (if (day) glowDay else glowNight)!!
                  m.setTranslate(cx, cy); glow.setLocalMatrix(m); p.shader = glow
                  c.drawCircle(cx, cy, glowR, p); p.shader = null
                  p.color = if (day) 0xFFFFE9A8.toInt() else 0xFFE9EDF7.toInt()
                  c.drawCircle(cx, cy, r, p)
                  if (!day) { p.color = top; c.drawCircle(cx + r * 0.4f, cy - r * 0.25f, r * 0.85f, p) }
                  for (i in 0..3) {
                      val baseY = h * (0.60f + 0.10f * i)
                      path.reset(); path.moveTo(0f, h)
                      val n = 36; val dir = if (i % 2 == 0) 1f else -1f
                      for (k in 0..n) {
                          val x = w * k / n
                          val y = baseY + sin(k * 0.5f + t * (0.5f + 0.15f * i) * dir + i * 1.8f) * h * 0.018f * (i + 1)
                          path.lineTo(x, y)
                      }
                      path.lineTo(w, h); path.close()
                      p.color = hsv(210f, 0.75f, (if (day) 0.45f else 0.25f) - 0.05f * i, 230)
                      c.drawPath(path, p)
                  }
              }
          }

          class WeatherScene : Scene {
              override val title = Scenes.titles[4]
              private var w = 1f; private var h = 1f
              private val rnd = Random(11)
              private val p = Paint(Paint.ANTI_ALIAS_FLAG)
              private val stars = StarField(5, 110)
              private var rain = FloatArray(0)
              private var snow = FloatArray(0)
              private var clouds = FloatArray(0)
              private var cloudShader: RadialGradient? = null
              private val m = Matrix()
              private val puffs = arrayOf(
                  floatArrayOf(-0.95f, 0.18f, 0.7f), floatArrayOf(0f, 0f, 1f),
                  floatArrayOf(0.95f, 0.2f, 0.75f), floatArrayOf(0.3f, -0.35f, 0.65f))

              override fun resize(w: Int, h: Int) {
                  this.w = w.toFloat(); this.h = h.toFloat(); stars.resize(this.w, this.h)
                  rain = FloatArray(180 * 4)
                  for (i in 0 until 180) { val o = i * 4
                      rain[o] = rnd.nextFloat() * this.w; rain[o+1] = rnd.nextFloat() * this.h
                      rain[o+2] = this.h * (0.02f + 0.02f * rnd.nextFloat())
                      rain[o+3] = this.h * (0.9f + 0.6f * rnd.nextFloat()) }
                  snow = FloatArray(130 * 5)
                  for (i in 0 until 130) { val o = i * 5
                      snow[o] = rnd.nextFloat() * this.w; snow[o+1] = rnd.nextFloat() * this.h
                      snow[o+2] = this.h * (0.002f + 0.003f * rnd.nextFloat())
                      snow[o+3] = rnd.nextFloat() * 6.283f
                      snow[o+4] = this.h * (0.05f + 0.07f * rnd.nextFloat()) }
                  clouds = FloatArray(6 * 4)
                  for (i in 0 until 6) { val o = i * 4
                      clouds[o] = rnd.nextFloat() * (this.w + 600f) - 300f
                      clouds[o+1] = this.h * (0.06f + 0.30f * rnd.nextFloat())
                      clouds[o+2] = this.h * (0.09f + 0.11f * rnd.nextFloat())
                      clouds[o+3] = this.w * (0.008f + 0.014f * rnd.nextFloat()) }
                  cloudShader = RadialGradient(0f, 0f, 1f, 0xC8FFFFFF.toInt(), 0x00FFFFFF, Shader.TileMode.CLAMP)
              }

              override fun draw(c: Canvas, t: Float, dt: Float, weather: WeatherData?) {
                  val kind = weather?.kind ?: WeatherKind.CLEAR
                  val day = weather?.isDay ?: (Calendar.getInstance().get(Calendar.HOUR_OF_DAY) in 7..18)
                  val (top, bot) = palette(kind, day)
                  p.shader = LinearGradient(0f, 0f, 0f, h, top, bot, Shader.TileMode.CLAMP)
                  c.drawRect(0f, 0f, w, h, p); p.shader = null
                  when (kind) {
                      WeatherKind.CLEAR -> if (day) drawSun(c, t) else { stars.draw(c, t, p); drawMoon(c, top) }
                      WeatherKind.CLOUDY -> { if (!day) stars.draw(c, t, p, 0.5f); drawClouds(c, dt, day) }
                      WeatherKind.RAIN -> { drawClouds(c, dt, day); drawRain(c, dt, false) }
                      WeatherKind.STORM -> {
                          drawClouds(c, dt, day); drawRain(c, dt, true)
                          val ft = t % 7f
                          if (ft < 0.12f) c.drawARGB(((1f - ft / 0.12f) * 130).toInt(), 255, 255, 255)
                      }
                      WeatherKind.SNOW -> { drawClouds(c, dt, day); drawSnow(c, t, dt) }
                      WeatherKind.FOG -> { drawClouds(c, dt, day); drawFog(c, t) }
                  }
              }

              private fun drawSun(c: Canvas, t: Float) {
                  val cx = w * 0.78f; val cy = h * 0.24f; val r = h * 0.07f
                  p.style = Paint.Style.STROKE; p.strokeWidth = h * 0.006f; p.color = 0x8CFFE082.toInt()
                  for (j in 0 until 12) {
                      val a = j * PI.toFloat() / 6f + t * 0.15f
                      val ca = cos(a); val sa = sin(a)
                      c.drawLine(cx + ca * r * 1.35f, cy + sa * r * 1.35f, cx + ca * r * 1.75f, cy + sa * r * 1.75f, p)
                  }
                  p.style = Paint.Style.FILL; p.color = 0xFFFFD54F.toInt(); c.drawCircle(cx, cy, r, p)
              }
              private fun drawMoon(c: Canvas, bgTop: Int) {
                  val cx = w * 0.78f; val cy = h * 0.22f; val r = h * 0.055f
                  p.color = 0xFFE9EDF7.toInt(); c.drawCircle(cx, cy, r, p)
                  p.color = bgTop; c.drawCircle(cx + r * 0.45f, cy - r * 0.3f, r * 0.9f, p)
              }
              private fun drawClouds(c: Canvas, dt: Float, day: Boolean) {
                  val sh = cloudShader ?: return
                  p.shader = sh; p.alpha = if (day) 210 else 100
                  for (i in 0 until 6) { val o = i * 4
                      clouds[o] += clouds[o+3] * dt
                      if (clouds[o] - clouds[o+2] * 2 > w) clouds[o] = -clouds[o+2] * 2
                      val x = clouds[o]; val y = clouds[o+1]; val s = clouds[o+2]
                      for (pf in puffs) {
                          val px = x + pf[0] * s; val py = y + pf[1] * s; val pr = s * pf[2]
                          m.setScale(pr, pr); m.postTranslate(px, py); sh.setLocalMatrix(m)
                          c.drawCircle(px, py, pr, p)
                      }
                  }
                  p.alpha = 255; p.shader = null
              }
              private fun drawRain(c: Canvas, dt: Float, heavy: Boolean) {
                  p.style = Paint.Style.STROKE; p.strokeWidth = h * 0.0022f; p.color = 0x99BBD4EE.toInt()
                  val n = if (heavy) 180 else 110; val sp = if (heavy) 1.5f else 1f
                  for (i in 0 until n) { val o = i * 4
                      rain[o+1] += rain[o+3] * sp * dt; rain[o] += rain[o+3] * 0.18f * dt
                      if (rain[o+1] > h) { rain[o+1] = -rain[o+2]; rain[o] = rnd.nextFloat() * w }
                      if (rain[o] > w) rain[o] -= w
                      val len = rain[o+2]
                      c.drawLine(rain[o], rain[o+1], rain[o] + len * 0.18f, rain[o+1] + len, p)
                  }
                  p.style = Paint.Style.FILL
              }
              private fun drawSnow(c: Canvas, t: Float, dt: Float) {
                  p.color = 0xE6FFFFFF.toInt()
                  for (i in 0 until 130) { val o = i * 5
                      snow[o+1] += snow[o+4] * dt
                      snow[o] += sin(t * 0.8f + snow[o+3]) * w * 0.012f * dt
                      if (snow[o+1] > h + 6f) { snow[o+1] = -6f; snow[o] = rnd.nextFloat() * w }
                      if (snow[o] > w) snow[o] -= w
                      if (snow[o] < 0) snow[o] += w
                      c.drawCircle(snow[o], snow[o+1], snow[o+2], p)
                  }
              }
              private fun drawFog(c: Canvas, t: Float) {
                  for (i in 0 until 5) {
                      val y = h * (0.15f + 0.17f * i)
                      val shift = sin(t * 0.05f + i * 1.4f) * w * 0.25f
                      p.shader = LinearGradient(shift, 0f, shift + w, 0f,
                          intArrayOf(0x00FFFFFF, 0x4DFFFFFF, 0x00FFFFFF), null, Shader.TileMode.CLAMP)
                      c.drawRect(0f, y, w, y + h * 0.11f, p)
                  }
                  p.shader = null
              }
              private fun palette(kind: WeatherKind, day: Boolean): Pair<Int, Int> = when (kind) {
                  WeatherKind.CLEAR  -> if (day) 0xFF2E6FD8.toInt() to 0xFF9CC7F5.toInt() else 0xFF070B22.toInt() to 0xFF1B2447.toInt()
                  WeatherKind.CLOUDY -> if (day) 0xFF5A7BA6.toInt() to 0xFFA8BDD6.toInt() else 0xFF141B2E.toInt() to 0xFF2A3550.toInt()
                  WeatherKind.RAIN   -> if (day) 0xFF41586F.toInt() to 0xFF71859A.toInt() else 0xFF0D1420.toInt() to 0xFF232E40.toInt()
                  WeatherKind.STORM  -> if (day) 0xFF33424F.toInt() to 0xFF5A6B7C.toInt() else 0xFF090E16.toInt() to 0xFF1B2430.toInt()
                  WeatherKind.SNOW   -> if (day) 0xFF7C93B5.toInt() to 0xFFC9D6E8.toInt() else 0xFF1A2338.toInt() to 0xFF33415C.toInt()
                  WeatherKind.FOG    -> if (day) 0xFF6E7B8A.toInt() to 0xFFAAB6C2.toInt() else 0xFF232B36.toInt() to 0xFF4A5560.toInt()
              }
          }

          class BokehScene : Scene {
              override val title = Scenes.titles[5]
              private var w = 1f; private var h = 1f
              private val rnd = Random(21)
              private val p = Paint(Paint.ANTI_ALIAS_FLAG)
              private val m = Matrix()
              private val hues = floatArrayOf(38f, 330f, 195f, 265f)
              private var parts = FloatArray(0)
              private var shaders = emptyArray<RadialGradient>()

              override fun resize(w: Int, h: Int) {
                  this.w = w.toFloat(); this.h = h.toFloat()
                  parts = FloatArray(26 * 6)
                  for (i in 0 until 26) { val o = i * 6
                      parts[o] = rnd.nextFloat() * this.w; parts[o+1] = rnd.nextFloat() * this.h
                      parts[o+2] = this.h * (0.03f + 0.10f * rnd.nextFloat())
                      parts[o+3] = this.h * (0.015f + 0.03f * rnd.nextFloat())
                      parts[o+4] = rnd.nextInt(4).toFloat(); parts[o+5] = rnd.nextFloat() * 6.283f }
                  shaders = Array(4) {
                      RadialGradient(0f, 0f, 1f,
                          intArrayOf(hsv(hues[it], 0.5f, 1f, 130), hsv(hues[it], 0.6f, 1f, 0)), null, Shader.TileMode.CLAMP)
                  }
              }
              override fun draw(c: Canvas, t: Float, dt: Float, weather: WeatherData?) {
                  p.shader = LinearGradient(0f, 0f, 0f, h, 0xFF161028.toInt(), 0xFF2B1740.toInt(), Shader.TileMode.CLAMP)
                  c.drawRect(0f, 0f, w, h, p)
                  for (i in 0 until 26) { val o = i * 6
                      parts[o+1] -= parts[o+3] * dt
                      val r = parts[o+2]
                      if (parts[o+1] < -r) { parts[o+1] = h + r; parts[o] = rnd.nextFloat() * w }
                      val x = parts[o] + sin(t * 0.4f + parts[o+5]) * w * 0.012f
                      val sh = shaders[parts[o+4].toInt()]
                      m.setScale(r, r); m.postTranslate(x, parts[o+1]); sh.setLocalMatrix(m)
                      p.shader = sh
                      p.alpha = (150 + 80 * sin(t * 0.6f + parts[o+5])).toInt().coerceIn(60, 230)
                      c.drawCircle(x, parts[o+1], r, p)
                  }
                  p.alpha = 255; p.shader = null
              }
          }
